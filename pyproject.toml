[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_rokka"]

[project]
name = "django-rokka"
version = "0.1.0"
description = "Django ImageField backed by Rokka.io"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "requests>=2.32.5",
]
